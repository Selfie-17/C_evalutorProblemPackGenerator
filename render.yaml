services:
  - type: web
    name: c-lab-evaluator-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: FRONTEND_URL
        sync: false
      - key: CC
        value: gcc
      - key: CFLAGS
        value: -std=c11 -O2 -pipe
      - key: MAX_EVALUATION_WORKERS
        value: 3
      - key: DEFAULT_EXECUTION_TIMEOUT
        value: 5
      - key: MAX_EXECUTION_TIMEOUT
        value: 15
      - key: MAX_CODE_SIZE
        value: 65536
      - key: MAX_STDIN_SIZE
        value: 262144
